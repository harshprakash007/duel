name: duel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duel
      POSTGRES_PASSWORD: duel
      POSTGRES_DB: duel
    ports:
      - '${HOST_PGPORT:-5435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duel']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${HOST_REDISPORT:-6385}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://duel:duel@postgres:5432/duel
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-key-at-least-32-chars-long}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 'true'
      CF_USER_AGENT: '${CF_USER_AGENT:-Duel/0.1 (contact: admin@example.com)}'
      CF_BASE_URL: ${CF_BASE_URL:-https://codeforces.com/api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

  backup:
    profiles: ['app']
    image: postgres:16-alpine
    environment:
      PGPASSWORD: duel
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
